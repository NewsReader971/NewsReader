<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CNA News RSS Archive"
    >

    <title>CNA News</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="site-header">

        <div class="header-inner">

            <div class="brand">

                <div class="brand-mark">
                    CNA
                </div>

                <div class="brand-text">

                    <h1>
                        CNA News
                    </h1>

                    <p>
                        Channel NewsAsia RSS Archive
                    </p>

                </div>

            </div>


            <div class="update-status">

                <div class="update-label">
                    DATA LAST UPDATED
                </div>

                <div
                    class="status-value"
                    id="last-updated"
                >
                    Loading...
                </div>

                <div
                    class="update-relative"
                    id="update-relative"
                >
                    Loading...
                </div>

            </div>

        </div>

    </header>


    <!-- =========================================
         CATEGORY NAVIGATION
    ========================================== -->

    <nav class="category-nav">

        <div class="category-inner">

            <button
                type="button"
                class="category-button active"
                data-source="all"
            >
                All News
            </button>

            <button
                type="button"
                class="category-button"
                data-source="Latest News"
            >
                Latest News
            </button>

            <button
                type="button"
                class="category-button"
                data-source="Asia"
            >
                Asia
            </button>

            <button
                type="button"
                class="category-button"
                data-source="Business"
            >
                Business
            </button>

            <button
                type="button"
                class="category-button"
                data-source="Singapore"
            >
                Singapore
            </button>

            <button
                type="button"
                class="category-button"
                data-source="World"
            >
                World
            </button>

            <button
                type="button"
                class="category-button"
                data-source="Today"
            >
                Today
            </button>

        </div>

    </nav>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="main-container">


        <!-- =====================================
             FILTER CONTROLS
        ====================================== -->

        <section class="controls">


            <!-- Source -->

            <div class="control">

                <label for="source-filter">
                    Source
                </label>

                <select id="source-filter">

                    <option value="all">
                        All sources
                    </option>

                    <option value="Latest News">
                        Latest News
                    </option>

                    <option value="Asia">
                        Asia
                    </option>

                    <option value="Business">
                        Business
                    </option>

                    <option value="Singapore">
                        Singapore
                    </option>

                    <option value="World">
                        World
                    </option>

                    <option value="Today">
                        Today
                    </option>

                </select>

            </div>


            <!-- Date -->

            <div class="control">

                <label for="date-filter">
                    Date
                </label>

                <select id="date-filter">

                    <option value="all">
                        All dates
                    </option>

                </select>

            </div>


            <!-- Search -->

            <div class="control search-control">

                <label for="search">
                    Search
                </label>

                <div class="search-wrapper">
                    <input
                        type="search"
                        id="search"
                        placeholder="Search articles..."
                        autocomplete="off"
                    >
                </div>

            </div>


            <!-- Clear -->

            <button
                type="button"
                class="clear-button"
                id="clear-filters"
            >
                Clear
            </button>

        </section>


        <!-- =====================================
             SUMMARY
        ====================================== -->

        <section class="summary-bar">


            <div class="summary-left">

                <h2 id="page-title">
                    All News
                </h2>

                <p class="article-summary">

                    Showing

                    <strong id="article-count">
                        Loading...
                    </strong>

                    <span id="summary-description">
                        articles
                    </span>

                </p>

            </div>


            <div class="refresh-info">

                <span
                    class="status-dot"
                    id="status-dot"
                ></span>

                <span id="refresh-status">
                    Connecting...
                </span>

            </div>

        </section>


        <!-- =====================================
             NEWS
        ====================================== -->

        <section id="news-container">

            <div class="loading">

                <div class="spinner"></div>

                <p>
                    Loading news...
                </p>

            </div>

        </section>


    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="site-footer">

        <p>
            News data collected automatically from
            Channel NewsAsia RSS feeds.
        </p>

        <p>
            Articles are retained for 30 days.
        </p>

    </footer>


    <script src="./app.js"></script>

</body>

</html>
