<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="RSS News Reader"
    >

    <title>RSS News Reader</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="site-header">

        <div class="header-inner">

            <div class="brand">

                <div class="brand-mark">
                    NR
                </div>

                <div class="brand-text">

                    <h1>
                        News Reader
                    </h1>

                    <p>
                        News from RSS feeds
                    </p>

                </div>

            </div>


            <div class="update-status">

                <div class="update-label">
                    DATA LAST UPDATED
                </div>

                <div
                    class="status-value"
                    id="last-updated"
                >
                    Loading...
                </div>

                <div
                    class="update-relative"
                    id="update-relative"
                >
                    Loading...
                </div>

            </div>

        </div>

    </header>


    <!-- =========================================
         SOURCE NAVIGATION
    ========================================== -->

    <nav class="category-nav">

        <div class="category-inner">

            <button
                type="button"
                class="category-button active"
                data-source="CNA"
            >
                CNA
            </button>

            <button
                type="button"
                class="category-button"
                data-source="France 24"
            >
                France 24
            </button>

            <button
                type="button"
                class="category-button"
                data-source="BBC"
            >
                BBC
            </button>

            <button
                type="button"
                class="category-button"
                data-source="SCMP"
            >
                SCMP
            </button>

        </div>

    </nav>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="main-container">


        <!-- =====================================
             FILTER CONTROLS
        ====================================== -->

        <section class="controls">


            <!-- Category -->

            <div class="control">

                <label for="category-filter">
                    Category
                </label>

                <select id="category-filter">

                    <option value="all">
                        All categories
                    </option>

                </select>

            </div>


            <!-- Date -->

            <div class="control">

                <label for="date-filter">
                    Date
                </label>

                <select id="date-filter">

                    <option value="all">
                        All dates
                    </option>

                </select>

            </div>


            <!-- Search -->

            <div class="control search-control">

                <label for="search">
                    Search
                </label>

                <div class="search-wrapper">

                    <input
                        type="search"
                        id="search"
                        placeholder="Search articles..."
                        autocomplete="off"
                    >

                </div>

            </div>


            <!-- Clear -->

            <button
                type="button"
                class="clear-button"
                id="clear-filters"
            >
                Clear
            </button>

        </section>


        <!-- =====================================
             SUMMARY
        ====================================== -->

        <section class="summary-bar">

            <div class="summary-left">

                <h2 id="page-title">
                    CNA
                </h2>

                <p class="article-summary">

                    Showing

                    <strong id="article-count">
                        Loading...
                    </strong>

                    <span id="summary-description">
                        articles
                    </span>

                </p>

            </div>


            <div class="refresh-info">

                <span
                    class="status-dot"
                    id="status-dot"
                ></span>

                <span id="refresh-status">
                    Connecting...
                </span>

            </div>

        </section>


        <!-- =====================================
             NEWS
        ====================================== -->

        <section id="news-container">

            <div class="loading">

                <div class="spinner"></div>

                <p>
                    Loading news...
                </p>

            </div>

        </section>


    </main>


    <script src="./app.js"></script>

</body>

</html>
