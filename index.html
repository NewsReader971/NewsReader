<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CNA News RSS Reader"
    >

    <title>CNA News</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <div class="header-inner">

            <div class="brand">

                <div class="brand-icon">
                    CNA
                </div>

                <div>

                    <h1>CNA News</h1>

                    <p>
                        Channel NewsAsia RSS Archive
                    </p>

                </div>

            </div>


            <div class="update-status">

                <div class="status-label">
                    DATA LAST UPDATED
                </div>

                <div
                    class="status-value"
                    id="last-updated"
                >
                    Loading...
                </div>

                <div
                    class="status-relative"
                    id="last-updated-relative"
                >
                </div>

            </div>

        </div>

    </header>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="category-nav">

        <div class="category-inner">

            <button
                class="category-button active"
                data-source="all"
            >
                All News
            </button>

            <button
                class="category-button"
                data-source="Latest News"
            >
                Latest News
            </button>

            <button
                class="category-button"
                data-source="Asia"
            >
                Asia
            </button>

            <button
                class="category-button"
                data-source="Business"
            >
                Business
            </button>

            <button
                class="category-button"
                data-source="Singapore"
            >
                Singapore
            </button>

            <button
                class="category-button"
                data-source="World"
            >
                World
            </button>

            <button
                class="category-button"
                data-source="Today"
            >
                Today
            </button>

        </div>

    </nav>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main-container">


        <!-- Controls -->

        <section class="controls">

            <div class="control">

                <label for="date-filter">
                    Date
                </label>

                <select id="date-filter">

                    <option value="all">
                        All dates
                    </option>

                </select>

            </div>


            <div class="control search-control">

                <label for="search">
                    Search
                </label>

                <div class="search-wrapper">

                    <span class="search-icon">
                        🔍
                    </span>

                    <input
                        type="search"
                        id="search"
                        placeholder="Search articles..."
                        autocomplete="off"
                    >

                </div>

            </div>


            <button
                class="refresh-button"
                id="refresh-button"
                type="button"
            >

                <span id="refresh-icon">
                    ↻
                </span>

                Refresh

            </button>

        </section>


        <!-- =========================
             NEWS SUMMARY
        ========================== -->

        <section class="news-summary">

            <div>

                <h2 id="page-title">
                    All News
                </h2>

                <p id="article-count">
                    Loading articles...
                </p>

            </div>


            <div class="latest-info">

                <span>
                    Latest article
                </span>

                <strong id="latest-article">
                    Loading...
                </strong>

            </div>

        </section>


        <!-- =========================
             NEWS
        ========================== -->

        <section id="news-container">

            <div class="loading">

                <div class="spinner"></div>

                <p>
                    Loading news...
                </p>

            </div>

        </section>


        <!-- =========================
             LOAD MORE
        ========================== -->

        <div
            class="load-more-container"
            id="load-more-container"
            hidden
        >

            <button
                id="load-more"
                class="load-more-button"
            >
                Load more
            </button>

        </div>


    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="site-footer">

        <p>
            News data collected automatically from
            Channel NewsAsia RSS feeds.
        </p>

        <p>
            Articles are retained for 30 days.
        </p>

    </footer>


    <script src="app.js"></script>

</body>

</html>
