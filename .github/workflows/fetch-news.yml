name: Fetch CNA News

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"

  # Allows you to manually run it from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Get repository files
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Set up Python
      # --------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt


      # --------------------------------------------------
      # Fetch RSS feeds
      # --------------------------------------------------

      - name: Fetch CNA RSS feeds
        run: |
          python scraper/fetch_rss.py


      # --------------------------------------------------
      # Commit updated database
      # --------------------------------------------------

      - name: Commit updated news database
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news.json

          # Only commit if news.json actually changed
          git diff --cached --quiet || \
            git commit -m "Update news database"

          git push
